name: Apply equipment slice

on:
  push:
    branches:
      - finish-equipment-tab

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: finish-equipment-tab
      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          cat .github/equipment-slice/part-* > /tmp/equipment-slice.tar.xz
          echo "76ccb71d190123e28d0e425b747b0100d30a2852726348466d575bfb8bb0cf2a  /tmp/equipment-slice.tar.xz" | sha256sum -c -
      - name: Apply exact source files
        shell: bash
        run: |
          tar -xJf /tmp/equipment-slice.tar.xz -C .
          rm -rf .github/equipment-slice
          rm -f .github/workflows/apply-equipment-slice.yml
      - name: Commit completed T3A slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish wearable equipment authoring"
          git push origin HEAD:finish-equipment-tab
