name: Recover T3B implementation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'repair-t3b-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Locate historical T3B trees
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          echo "Recent graph:"
          git log --all --oneline --decorate --graph -40
          echo "Commits containing T3B host service:"
          found=0
          while read -r commit; do
            if git cat-file -e "${commit}:host/Services/HandItemAuthoringService.cs" 2>/dev/null; then
              echo "FOUND ${commit} $(git log -1 --format=%s "${commit}")"
              found=1
            fi
          done < <(git rev-list --all)
          echo "Commits containing T3B Godot editor:"
          while read -r commit; do
            if git cat-file -e "${commit}:content-studio/scripts/hand_item_editor.gd" 2>/dev/null; then
              echo "FOUND_EDITOR ${commit} $(git log -1 --format=%s "${commit}")"
            fi
          done < <(git rev-list --all)
          if [[ "${found}" -eq 0 ]]; then
            echo "NO_T3B_TREE_FOUND"
          fi
          exit 1
