name: Apply T3B payload
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t3b-weapons-tools
          fetch-depth: 0
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .t3b-bootstrap/chunk-* > /tmp/t3b.b64
          base64 -d /tmp/t3b.b64 > /tmp/t3b.tar.gz
          echo "5cf4c8a68033ae6fa2ea6d72639a6b4bde1345ed1c9920b14c8b06399d50a68d  /tmp/t3b.tar.gz" | sha256sum -c -
          tar -xzf /tmp/t3b.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .t3b-bootstrap .github/workflows/apply-t3b.yml
      - name: Validate source contracts
        run: python3 -m unittest discover -s tests/contract -p 'test_*.py' -v
      - name: Commit exact implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement T3B weapons and tools authoring"
          git push origin HEAD:t3b-weapons-tools
