name: Export repair workspace
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'repair-t3b-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove Git metadata from export
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: repair-workspace
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
