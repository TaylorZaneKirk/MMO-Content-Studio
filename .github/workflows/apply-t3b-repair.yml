name: Recover T3B implementation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  recover:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'repair-t3b-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair shifted payload chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .t3b-bootstrap/fix00-* > .t3b-bootstrap/chunk-00
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.t3b-bootstrap')
          prefix = (root / 'fix01-00').read_text()
          remote = (root / 'chunk-01').read_text()
          target = 'ebc9df2994601c79e780fab4f18039d9070207bd'
          expected_length = 12000
          suffix_length = expected_length - len(prefix)

          def blob_sha(text: str) -> str:
              data = text.encode('ascii')
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          candidates = []
          if len(remote) >= suffix_length:
              for start in range(len(remote) - suffix_length + 1):
                  candidate = prefix + remote[start:start + suffix_length]
                  if blob_sha(candidate) == target:
                      candidates.append((start, candidate))

          if len(candidates) != 1:
              print(f'prefix_length={len(prefix)} remote_length={len(remote)} suffix_length={suffix_length}')
              print(f'matching_shift_candidates={[start for start, _ in candidates]}')
              raise SystemExit('Unable to recover chunk-01 as one exact prefix plus a shifted contiguous suffix.')

          start, candidate = candidates[0]
          print(f'Recovered chunk-01 using remote suffix offset {start}.')
          (root / 'chunk-01').write_text(candidate)
          PY
      - name: Verify and reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'chunk-00': '30064ae41f9d38e3f4b569a1b2aef318cf20e203',
              'chunk-01': 'ebc9df2994601c79e780fab4f18039d9070207bd',
              'chunk-02': 'd5e094b31a7583b30a9aa19325a455aed92524ba',
              'chunk-03': '14533cb4eb28b46bcc86380e3acab01c5af18dce',
              'chunk-04': 'eb56af92c6ba036a2a197ab3382b4105187b1ad2',
              'chunk-05': 'ad7cc86afacf0e5a647ed0a7049ab6482ea7e913',
              'chunk-06': 'b81d22b09c782bebcb956d11062b886a90bebb2b',
          }
          for name, wanted in expected.items():
              data = (Path('.t3b-bootstrap') / name).read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'{name} Git blob mismatch: expected {wanted}, got {actual}')
          PY
          cat .t3b-bootstrap/chunk-0[0-6] > /tmp/t3b.b64
          base64 -d /tmp/t3b.b64 > /tmp/t3b.tar.gz
          echo "5cf4c8a68033ae6fa2ea6d72639a6b4bde1345ed1c9920b14c8b06399d50a68d  /tmp/t3b.tar.gz" | sha256sum -c -
          tar -xzf /tmp/t3b.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .t3b-bootstrap .github/workflows/apply-t3b.yml .github/workflows/apply-t3b-repair.yml
      - name: Validate source contracts
        run: python3 -m unittest discover -s tests/contract -p 'test_*.py' -v
      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          test -f host/Services/HandItemAuthoringService.cs
          test -f content-studio/scripts/hand_item_editor.gd
          test -f integrations/mmo-project/prototype/sql/018_item_hand_and_tool_profiles.sql
          test ! -e .t3b-bootstrap
          test ! -e .github/workflows/apply-t3b.yml
          test ! -e .github/workflows/apply-t3b-repair.yml
      - name: Commit recovered implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover T3B implementation"
          git push origin HEAD:${{ github.head_ref }}
